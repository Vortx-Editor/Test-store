<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<title>Zyra — Web3 Wallet</title>
<style>
  /* ---------- Fonts ---------- */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  /* ---------- Tokens ---------- */
  :root{
    --bg:#0a0a0b;
    --panel:#0d0d0e;
    --fg:#f4f5f2;
    --muted:#8b8d86;
    --accent:#c8f135;      /* lime green */
    --accent-fg:#0a0a0b;
    --ring:rgba(255,255,255,.09);
    --radius:999px;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  /* ---------- Stage / hero ---------- */
  .hero{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
      radial-gradient(120% 80% at 50% 12%, #131314 0%, #0a0a0b 55%, #050505 100%);
  }

  /* subtle starfield */
  .stars{position:absolute;inset:0;z-index:0;opacity:.5}

  /* globe canvas */
  #globe{
    position:absolute;
    top:46%;left:50%;
    transform:translate(-50%,-50%);
    z-index:1;
    opacity:0;
    animation:globeIn 1.6s cubic-bezier(.16,1,.3,1) .2s forwards;
  }
  @keyframes globeIn{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

  /* glow under globe */
  .floor-glow{
    position:absolute;
    left:50%;bottom:6%;
    width:60%;height:220px;
    transform:translateX(-50%);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.14), rgba(255,255,255,0) 70%);
    filter:blur(6px);
    z-index:1;
    opacity:0;
    animation:fade 2s ease 1s forwards;
  }
  @keyframes fade{to{opacity:1}}

  /* ---------- Nav ---------- */
  nav{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:28px clamp(20px,4vw,64px);
    opacity:0;transform:translateY(-14px);
    animation:dropIn .8s cubic-bezier(.16,1,.3,1) .15s forwards;
  }
  @keyframes dropIn{to{opacity:1;transform:translateY(0)}}

  .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em}
  .brand .mark{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--fg);
    display:grid;place-items:center;position:relative;
  }
  .brand .mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--fg);
    box-shadow:6px 0 0 -3px var(--bg);transform:translateX(-1px)}

  .menu{
    display:flex;align-items:center;gap:6px;
    padding:7px 8px;
    background:rgba(255,255,255,.04);
    border:1px solid var(--ring);
    border-radius:var(--radius);
    backdrop-filter:blur(8px);
  }
  .menu a{
    color:var(--muted);text-decoration:none;font-size:14px;font-weight:400;
    padding:7px 16px;border-radius:var(--radius);transition:.25s;
  }
  .menu a:hover{color:var(--fg);background:rgba(255,255,255,.06)}

  .btn{
    display:inline-flex;align-items:center;gap:10px;
    border:none;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:500;border-radius:var(--radius);
    transition:transform .25s, filter .25s, background .25s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-accent{background:var(--accent);color:var(--accent-fg);padding:11px 12px 11px 20px}
  .btn-accent .ico{background:var(--accent-fg);color:var(--accent)}
  .btn .ico{
    width:26px;height:26px;border-radius:50%;
    display:grid;place-items:center;font-size:13px;
  }
  .btn-ghost{background:transparent;color:var(--fg);padding:11px 20px}
  .btn-ghost:hover{background:rgba(255,255,255,.05)}

  /* ---------- Hero content ---------- */
  .content{
    position:absolute;z-index:5;
    left:clamp(20px,4vw,64px);
    bottom:clamp(48px,9vh,110px);
    max-width:720px;
  }
  h1{
    font-size:clamp(38px,5.4vw,78px);
    font-weight:500;
    line-height:1.02;
    letter-spacing:-.03em;
    margin-bottom:22px;
  }
  h1 .line{display:block;overflow:hidden}
  h1 .word{display:inline-block;margin-right:.22em;transform:translateY(110%);opacity:0}
  .revealed h1 .word{animation:wordUp .9s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes wordUp{to{transform:translateY(0);opacity:1}}

  .sub{
    color:var(--muted);
    font-size:clamp(14px,1.15vw,17px);
    line-height:1.55;
    max-width:430px;
    margin-bottom:34px;
    opacity:0;transform:translateY(16px);
  }
  .revealed .sub{animation:upFade .8s ease 1.05s forwards}
  @keyframes upFade{to{opacity:1;transform:translateY(0)}}

  .cta{display:flex;align-items:center;gap:18px;opacity:0;transform:translateY(16px)}
  .revealed .cta{animation:upFade .8s ease 1.25s forwards}
  .watch{display:inline-flex;align-items:center;gap:10px;color:var(--fg);background:none;border:none;
    cursor:pointer;font-family:inherit;font-size:14px;font-weight:400;transition:.25s}
  .watch:hover{color:var(--accent)}
  .watch .play{width:30px;height:30px;border:1px solid var(--ring);border-radius:50%;
    display:grid;place-items:center;font-size:10px}

  /* ---------- Supported platforms ---------- */
  .platforms{
    position:absolute;z-index:5;
    right:clamp(20px,4vw,64px);
    bottom:clamp(48px,9vh,110px);
    display:flex;align-items:center;gap:14px;
    opacity:0;
  }
  .revealed .platforms{animation:fade .8s ease 1.4s forwards}
  .platforms span{color:var(--muted);font-size:13px}
  .platforms .p{
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.05);border:1px solid var(--ring);
    display:grid;place-items:center;color:var(--muted);transition:.25s;
  }
  .platforms .p:hover{color:var(--fg);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
  .platforms .p svg{width:18px;height:18px}

  @media (max-width:760px){
    .menu{display:none}
    .platforms{display:none}
    h1{font-size:40px}
  }
</style>
</head>
<body>
  <main class="hero" id="hero">
    <canvas class="stars" id="stars"></canvas>
    <canvas id="globe"></canvas>
    <div class="floor-glow"></div>

    <!-- Nav -->
    <nav>
      <div class="brand"><span class="mark"></span>Zyra</div>
      <div class="menu">
        <a href="#">Wallet</a>
        <a href="#">Features</a>
        <a href="#">Learn</a>
        <a href="#">Pricing</a>
        <a href="#">Community</a>
      </div>
      <button class="btn btn-accent">Get Started <span class="ico"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg></span></button>
    </nav>

    <!-- Hero copy -->
    <div class="content">
      <h1>
        <span class="line" data-text="Explore the Next"></span>
        <span class="line" data-text="Evolution of Web3 Wallets"></span>
      </h1>
      <p class="sub">Secure, lightning-fast, and designed for seamless DeFi, NFTs, and multichain interaction.</p>
      <div class="cta">
        <button class="btn btn-accent">Get Started <span class="ico"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"/></svg></span></button>
        <button class="watch"><span class="play"><svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span> Watch Demo</button>
      </div>
    </div>

    <!-- Supported platforms -->
    <div class="platforms">
      <span>Supported platform:</span>
      <div class="p" title="Web">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
      </div>
      <div class="p" title="macOS">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.6c0-2 1.6-3 1.7-3-1-1.4-2.4-1.6-2.9-1.6-1.3-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.4 2 2.4 2 1 0 1.3-.6 2.5-.6s1.5.6 2.5.6 1.7-.9 2.3-1.9c.7-1 1-2 1-2.1 0 0-2-.8-2.1-2.9zM14.6 6c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg>
      </div>
      <div class="p" title="Mobile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/></svg>
      </div>
    </div>
  </main>

<script>
/* ============ Split hero text into animated words ============ */
document.querySelectorAll('h1 .line').forEach((line, li)=>{
  const words = line.dataset.text.split(' ');
  words.forEach((w, wi)=>{
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    // stagger delay per word across both lines
    span.style.animationDelay = (0.35 + (li*3 + wi) * 0.09) + 's';
    line.appendChild(span);
  });
});
requestAnimationFrame(()=>document.getElementById('hero').classList.add('revealed'));

/* ============ Starfield ============ */
(function(){
  const c = document.getElementById('stars'), x = c.getContext('2d');
  let stars = [];
  function size(){
    c.width = innerWidth; c.height = innerHeight;
    stars = Array.from({length: Math.floor(innerWidth*innerHeight/6000)}, ()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.2+.2, a:Math.random()*.6+.1, s:Math.random()*.02+.004
    }));
  }
  size(); addEventListener('resize', size);
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    for(const st of stars){
      st.a += st.s; if(st.a>.7||st.a<.1) st.s*=-1;
      x.beginPath(); x.arc(st.x,st.y,st.r,0,7); 
      x.fillStyle='rgba(255,255,255,'+st.a+')'; x.fill();
    }
    requestAnimationFrame(loop);
  })();
})();

/* ============ Rotating wireframe network sphere ============ */
(function(){
  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  let W, H, R, DPR = Math.min(devicePixelRatio||1, 2);

  function resize(){
    const base = Math.min(innerWidth, innerHeight);
    R = base * 0.42;                 // sphere radius
    const size = R * 2.4;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    canvas.width = size * DPR;
    canvas.height = size * DPR;
    W = canvas.width; H = canvas.height;
  }
  resize(); addEventListener('resize', resize);

  // Fibonacci sphere of points
  const N = 620;
  const pts = [];
  for(let i=0;i<N;i++){
    const phi = Math.acos(1 - 2*(i+0.5)/N);
    const theta = Math.PI*(1+Math.sqrt(5))*i;
    pts.push({
      x:Math.sin(phi)*Math.cos(theta),
      y:Math.sin(phi)*Math.sin(theta),
      z:Math.cos(phi)
    });
  }

  // orbital rings (points on great circles at varying radii)
  const rings = [];
  [1.0, 0.72, 0.46].forEach((rr, idx)=>{
    const rp = [];
    const tilt = (idx*0.5 + 0.3);
    for(let a=0;a<Math.PI*2;a+=0.13){
      rp.push({
        x:Math.cos(a)*rr,
        y:Math.sin(a)*Math.sin(tilt)*rr,
        z:Math.sin(a)*Math.cos(tilt)*rr
      });
    }
    rings.push(rp);
  });

  let rot = 0;
  function rotY(p, s, c){ return {x:p.x*c + p.z*s, y:p.y, z:-p.x*s + p.z*c}; }
  function rotX(p, s, c){ return {x:p.x, y:p.y*c - p.z*s, z:p.y*s + p.z*c}; }

  const tiltS = Math.sin(-0.35), tiltC = Math.cos(-0.35);

  function draw(){
    rot += 0.0016;
    const s = Math.sin(rot), c = Math.cos(rot);
    ctx.clearRect(0,0,W,H);
    ctx.save();
    ctx.translate(W/2, H/2);
    const scale = R * DPR;

    // transform helper -> screen
    function proj(p){
      let q = rotY(p, s, c);
      q = rotX(q, tiltS, tiltC);
      const persp = 1.6 / (1.6 - q.z*0.55);
      return { X:q.x*scale*persp, Y:q.y*scale*persp, z:q.z, persp };
    }

    // project sphere points
    const sp = pts.map(proj);

    // connective lines between nearby points
    ctx.lineWidth = 0.65*DPR;
    for(let i=0;i<sp.length;i++){
      const a = sp[i];
      for(let j=i+1;j<i+9 && j<sp.length;j++){
        const b = sp[j];
        const dx=a.X-b.X, dy=a.Y-b.Y;
        const d2 = dx*dx+dy*dy;
        if(d2 < (scale*0.185)*(scale*0.185)){
          const depth = (a.z+b.z)/2;
          const alpha = Math.max(0, (depth+1)/2) * 0.42;
          ctx.strokeStyle = 'rgba(205,210,200,'+alpha+')';
          ctx.beginPath(); ctx.moveTo(a.X,a.Y); ctx.lineTo(b.X,b.Y); ctx.stroke();
        }
      }
    }

    // rings
    rings.forEach(rp=>{
      const proj2 = rp.map(proj);
      ctx.beginPath();
      proj2.forEach((p,i)=> i?ctx.lineTo(p.X,p.Y):ctx.moveTo(p.X,p.Y));
      ctx.closePath();
      ctx.strokeStyle='rgba(190,195,185,.2)';
      ctx.lineWidth=0.9*DPR;
      ctx.stroke();
    });

    // points on top
    for(const p of sp){
      const depth = (p.z+1)/2;
      const r = (0.7 + depth*1.7) * DPR;
      ctx.beginPath();
      ctx.arc(p.X, p.Y, r, 0, 7);
      ctx.fillStyle = 'rgba(233,236,228,'+(0.32 + depth*0.65)+')';
      ctx.fill();
    }

    ctx.restore();
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
