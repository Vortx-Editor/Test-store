<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTX | Ultimate WebGL Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #010103; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }
        .ui-layer {
            position: relative; z-index: 2; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: none; /* يخلي الماوس يخترق النص للثري دي */
        }
        .vortx-title {
            font-size: 12vw; font-weight: 900; margin: 0; letter-spacing: 0.1em;
            text-transform: uppercase;
            background: linear-gradient(90deg, #fff, #8e2de2, #00c6ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text; color: transparent;
            animation: flow 8s ease-in-out infinite;
            filter: drop-shadow(0 0 40px rgba(142, 45, 226, 0.4));
            mix-blend-mode: screen;
        }
        .subtitle {
            font-size: 1.5rem; letter-spacing: 0.6em; color: #a0a0b5;
            text-transform: uppercase; margin-top: -10px;
        }
        @keyframes flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div class="ui-layer">
        <h1 class="vortx-title">VORTX</h1>
        <p class="subtitle">Absolute Power</p>
    </div>

    <script>
        // أنميشن الدخول
        gsap.from(".vortx-title", { duration: 2.5, scale: 0.5, opacity: 0, ease: "expo.out" });
        gsap.from(".subtitle", { duration: 2, y: 30, opacity: 0, ease: "power3.out", delay: 1 });

        // إعدادات الثري دي
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010103, 0.15);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // أكواد التظليل (الرياضيات اللي تصنع البلازما)
        const vertexShader = `
            varying vec2 vUv;
            varying vec3 vPosition;
            void main() {
                vUv = uv;
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float time;
            varying vec2 vUv;
            varying vec3 vPosition;
            
            // معادلة توليد الضجيج (Noise)
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            vec3 fade(vec3 t) {return t*t*t*(t*(t*6.0-15.0)+10.0);}
            float cnoise(vec3 P){
                vec3 Pi0 = floor(P); vec3 Pi1 = Pi0 + vec3(1.0);
                Pi0 = mod(Pi0, 289.0); Pi1 = mod(Pi1, 289.0);
                vec3 Pf0 = fract(P); vec3 Pf1 = Pf0 - vec3(1.0);
                vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
                vec4 iy = vec4(Pi0.yy, Pi1.yy);
                vec4 iz0 = Pi0.zzzz; vec4 iz1 = Pi1.zzzz;
                vec4 ixy = permute(permute(ix) + iy);
                vec4 ixy0 = permute(ixy + iz0); vec4 ixy1 = permute(ixy + iz1);
                vec4 gx0 = ixy0 / 7.0; vec4 gy0 = fract(floor(gx0) / 7.0) - 0.5;
                gx0 = fract(gx0); vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
                vec4 sz0 = step(gz0, vec4(0.0));
                gx0 -= sz0 * (step(0.0, gx0) - 0.5); gy0 -= sz0 * (step(0.0, gy0) - 0.5);
                vec4 gx1 = ixy1 / 7.0; vec4 gy1 = fract(floor(gx1) / 7.0) - 0.5;
                gx1 = fract(gx1); vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
                vec4 sz1 = step(gz1, vec4(0.0));
                gx1 -= sz1 * (step(0.0, gx1) - 0.5); gy1 -= sz1 * (step(0.0, gy1) - 0.5);
                vec3 g000 = vec3(gx0.x,gy0.x,gz0.x); vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
                vec3 g010 = vec3(gx0.z,gy0.z,gz0.z); vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
                vec3 g001 = vec3(gx1.x,gy1.x,gz1.x); vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
                vec3 g011 = vec3(gx1.z,gy1.z,gz1.z); vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);
                vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
                g000 *= norm0.x; g010 *= norm0.y; g100 *= norm0.z; g110 *= norm0.w;
                vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
                g001 *= norm1.x; g011 *= norm1.y; g101 *= norm1.z; g111 *= norm1.w;
                float n000 = dot(g000, Pf0); float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
                float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z)); float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
                float n001 = dot(g001, vec3(Pf0.xy, Pf1.z)); float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
                float n011 = dot(g011, vec3(Pf0.x, Pf1.yz)); float n111 = dot(g111, Pf1);
                vec3 fade_xyz = fade(Pf0);
                vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
                vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
                float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x); 
                return 2.2 * n_xyz;
            }

            void main() {
                // دمج الألوان وحساب الحركة
                float noise = cnoise(vec3(vPosition.x * 2.0 + time * 0.5, vPosition.y * 2.0, vPosition.z * 2.0 - time * 0.8));
                float intensity = pow(abs(noise), 1.2);
                
                // الألوان: بنفسجي غامق وأزرق سماوي
                vec3 color1 = vec3(0.55, 0.17, 0.88); // Purple
                vec3 color2 = vec3(0.00, 0.77, 1.00); // Cyan
                
                vec3 finalColor = mix(color2, color1, noise + 0.5);
                
                gl_FragColor = vec4(finalColor * intensity * 2.5, 1.0);
            }
        `;

        // مجسم الطاقة (Core)
        const uniforms = { time: { value: 0.0 } };
        const coreGeo = new THREE.IcosahedronGeometry(1.2, 64);
        const coreMat = new THREE.ShaderMaterial({
            vertexShader, fragmentShader, uniforms, wireframe: false, transparent: true
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // هالة سلكية حول المجسم (Wireframe Halo)
        const haloGeo = new THREE.IcosahedronGeometry(1.4, 3);
        const haloMat = new THREE.MeshBasicMaterial({ 
            color: 0x8e2de2, wireframe: true, transparent: true, opacity: 0.15 
        });
        const halo = new THREE.Mesh(haloGeo, haloMat);
        scene.add(halo);

        // نظام جزيئات معقدة (Particles)
        const pGeo = new THREE.BufferGeometry();
        const pCount = 3000;
        const pPos = new Float32Array(pCount * 3);
        for(let i=0; i<pCount*3; i++){
            pPos[i] = (Math.random() - 0.5) * 15;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pMat = new THREE.PointsMaterial({
            color: 0x00c6ff, size: 0.03, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(pGeo, pMat);
        scene.add(particles);

        // تفاعل الماوس
        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // حلقة الأنميشن
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            
            // تحديث وقت المظلل (Shader)
            uniforms.time.value = t;
            
            // دوران العناصر
            core.rotation.y = t * 0.15;
            core.rotation.z = t * 0.1;
            
            halo.rotation.y = -t * 0.1;
            halo.rotation.x = t * 0.2;
            
            particles.rotation.y = t * 0.05;
            particles.rotation.x = t * 0.02;

            // حركة الكاميرا بنعومة (Parallax)
            camera.position.x += (mouseX * 0.8 - camera.position.x) * 0.05;
            camera.position.y += (mouseY * 0.8 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // تجاوب الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
