<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTX | Premium Cinematic Experience</title>
    <!-- استدعاء المكتبات -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --primary: #8e2de2;
            --secondary: #4a00e0;
            --accent: #00c6ff;
            --bg: #030305;
        }
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg); color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* حاوية الخلفية السينمائية */
        #webgl-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            pointer-events: none; 
        }

        /* المحتوى الأساسي */
        .content {
            position: relative; z-index: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh; text-align: center;
        }

        .title-container {
            position: relative; perspective: 1000px;
        }

        /* تأثيرات شعار فورتكس */
        h1.vortx-title {
            font-size: 9rem; font-weight: 900; margin: 0; letter-spacing: 0.2em;
            background: linear-gradient(270deg, var(--accent), var(--primary), var(--secondary));
            background-size: 400% 400%;
            -webkit-background-clip: text; color: transparent;
            animation: gradientShift 6s ease infinite;
            filter: drop-shadow(0 0 40px rgba(142, 45, 226, 0.5));
            text-transform: uppercase;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        p.subtitle {
            font-size: 1.5rem; color: #a0a0b5; margin-top: 10px;
            letter-spacing: 4px; font-weight: 300;
            text-transform: uppercase;
            opacity: 0; 
        }

        /* كروت الباقات بنظام Glassmorphism */
        .glass-cards {
            display: flex; gap: 2.5rem; margin-top: 5rem; flex-wrap: wrap; justify-content: center;
            opacity: 0; 
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px; padding: 40px 30px; width: 320px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer; position: relative; overflow: hidden;
        }

        /* لمعة الكرت عند التمرير */
        .card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-20deg); transition: 0.6s;
        }

        .card:hover::before { left: 150%; }
        .card:hover {
            transform: translateY(-12px); border-color: rgba(142, 45, 226, 0.6);
            box-shadow: 0 15px 50px rgba(142, 45, 226, 0.2);
        }

        .card h3 { margin: 0 0 15px 0; color: #fff; font-size: 1.6rem; letter-spacing: 1px;}
        .card p { margin: 0; color: #8e8e9f; line-height: 1.7; font-size: 1rem;}
    </style>
</head>
<body>
    
    <!-- خلفية الجزيئات ثلاثية الأبعاد -->
    <div id="webgl-container"></div>
    
    <div class="content">
        <div class="title-container">
            <h1 class="vortx-title">VORTX</h1>
        </div>
        <p class="subtitle">Cinematic Editing & Design</p>
        
        <!-- باقاتك -->
        <div class="glass-cards">
            <div class="card">
                <h3>Premium Cuts</h3>
                <p>انتقالات سلسة وإيقاع ديناميكي يشد المشاهد من أول ثانية.</p>
            </div>
            <div class="card">
                <h3>VFX & Motion</h3>
                <p>مؤثرات بصرية وموشن جرافيك احترافي يعطي مقاطعك طابع الاستوديوهات الضخمة.</p>
            </div>
            <div class="card">
                <h3>Color Grading</h3>
                <p>تلوين سينمائي يبرز أدق التفاصيل ويعكس هوية بصرية فخمة.</p>
            </div>
        </div>
    </div>

    <script>
        // أنميشن دخول العناصر باستخدام GSAP
        gsap.from(".vortx-title", { duration: 2, y: 60, opacity: 0, ease: "power4.out", delay: 0.3 });
        gsap.to(".subtitle", { duration: 1.5, opacity: 1, y: -10, ease: "power3.out", delay: 1.2 });
        gsap.to(".glass-cards", { duration: 1.5, opacity: 1, y: -20, ease: "power3.out", stagger: 0.2, delay: 1.8 });

        // بناء البيئة السينمائية باستخدام Three.js
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030305, 0.0008); // ضباب خفيف للعمق

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 600;

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // تحسين الأداء
        container.appendChild(renderer.domElement);

        // إنشاء نظام الجزيئات (Particles System)
        const particleCount = 3000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const color1 = new THREE.Color(0x8e2de2); // بنفسجي غامق
        const color2 = new THREE.Color(0x00c6ff); // أزرق نيون

        for (let i = 0; i < particleCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 2500;
            positions[i + 1] = (Math.random() - 0.5) * 2500;
            positions[i + 2] = (Math.random() - 0.5) * 2500;

            // دمج الألوان عشوائياً لكل جزيء
            const mixedColor = color1.clone().lerp(color2, Math.random());
            colors[i] = mixedColor.r;
            colors[i + 1] = mixedColor.g;
            colors[i + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // مادة الجزيئات مع إضاءة خفيفة
        const material = new THREE.PointsMaterial({
            size: 3.5,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            sizeAttenuation: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // تفاعل الكاميرا مع الماوس
        let mouseX = 0;
        let mouseY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.08;
            mouseY = (event.clientY - windowHalfY) * 0.08;
        });

        // حلقة الأنميشن (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // دوران بطيء ومستمر للجزيئات
            particles.rotation.y += 0.0008;
            particles.rotation.x += 0.0004;

            // حركة كاميرا سلسة (Parallax)
            camera.position.x += (mouseX - camera.position.x) * 0.03;
            camera.position.y += (-mouseY - camera.position.y) * 0.03;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();

        // تجاوب الشاشة عند تغيير الحجم
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
