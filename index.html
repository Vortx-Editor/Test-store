<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTX | Ultra Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        :root {
            --bg-color: #020204;
            --accent-glow: #00e5ff;
            --purple-glow: #9d00ff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden; /* عشان ما يطلع سكرول ويخرب الشكل */
            color: white;
        }

        /* حاوية الثري دي بالخلفية */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* محتوى الموقع فوق الثري دي */
        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            pointer-events: none; /* عشان تقدر تتفاعل مع الثري دي بالماوس */
        }

        .title {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--accent-glow), var(--purple-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(157, 0, 255, 0.4));
            opacity: 0; /* للأنميشن */
            transform: translateY(50px);
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 0.4em;
            color: #a3a3b5;
            margin-top: 15px;
            text-transform: uppercase;
            opacity: 0;
        }

        .action-btn {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1rem;
            letter-spacing: 2px;
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            text-transform: uppercase;
            opacity: 0;
        }

        .action-btn:hover {
            background: rgba(157, 0, 255, 0.2);
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="content">
        <h1 class="title">VORTX</h1>
        <p class="subtitle">Cinematic Digital Experience</p>
        <button class="action-btn">Explore Now</button>
    </div>

    <script>
        // --- 1. أنميشن النصوص بالـ GSAP ---
        gsap.to(".title", { duration: 1.5, opacity: 1, y: 0, ease: "power4.out", delay: 0.5 });
        gsap.to(".subtitle", { duration: 1.5, opacity: 1, y: 0, ease: "power3.out", delay: 0.9 });
        gsap.to(".action-btn", { duration: 1, opacity: 1, y: 0, ease: "power2.out", delay: 1.3 });

        // --- 2. إعداد مشهد الـ Three.js ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // كاميرا
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        // الريندر
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 3. إنشاء الشكل الهندسي المعقد (Torus Knot) ---
        const geometry = new THREE.TorusKnotGeometry(10, 3, 200, 32);
        
        // مادة الشكل (نقاط مضيئة كأنها بارتيكلز)
        const material = new THREE.PointsMaterial({ 
            size: 0.1, 
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const torusKnot = new THREE.Points(geometry, material);
        scene.add(torusKnot);

        // إضافة جزيئات صغيرة طايرة في الخلفية
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x9d00ff,
            blending: THREE.AdditiveBlending
        });
        
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // --- 4. تفاعل الماوس (Parallax) ---
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // --- 5. حلقة الأنميشن ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // حركة الشكل الهندسي
            torusKnot.rotation.y += 0.005;
            torusKnot.rotation.x += 0.002;
            
            // تموج الشكل الهندسي
            torusKnot.position.y = Math.sin(elapsedTime * 0.5) * 2;

            // حركة الجزيئات الخلفية
            particlesMesh.rotation.y = -elapsedTime * 0.05;

            // نعومة حركة الكاميرا مع الماوس
            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;
            
            torusKnot.rotation.y += 0.05 * (targetX - torusKnot.rotation.y);
            torusKnot.rotation.x += 0.05 * (targetY - torusKnot.rotation.x);

            renderer.render(scene, camera);
        }

        animate();

        // --- 6. التجاوب مع حجم الشاشة ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
