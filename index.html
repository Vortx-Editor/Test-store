<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VORTX Store</title>
  <style>
    /* ==========================================
       1. إعادة ضبط العرض ومنع الفراغات الجانبية
       ========================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important; /* منع التمرير الأفقي تماماً */
      background-color: #0b0713;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .main-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ==========================================
       2. تصميم كارت Web Page Bundles (زجاجي + لمعان)
       ========================================== */
    .glass-card-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
      border-radius: 20px;
      padding: 2px; /* لإعطاء إطار مضيء خفيف */
    }

    /* الوهج والإضاءة الخلفية (Glow Effect) */
    .glass-card-wrapper::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(126, 34, 206, 0.1) 60%, transparent 80%);
      filter: blur(25px);
      z-index: 0;
      border-radius: 30px;
      pointer-events: none;
    }

    /* الكارت الزجاجي (Apple Glass Style) */
    .glass-card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05); /* خلفية شبه شفافة */
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* طبقة اللمعان الزجاجي المائل فوق الكارت (Glossy Overlay) */
    .glass-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        115deg,
        transparent 20%,
        rgba(255, 255, 255, 0.25) 45%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0.25) 55%,
        transparent 80%
      );
      transition: all 0.8s ease;
      pointer-events: none;
    }

    /* حركية اللمعان عند مرور الماوس */
    .glass-card:hover::after {
      left: 150%;
    }

    /* ==========================================
       3. ضبط النص والكلمة بسطر واحد
       ========================================== */
    .bundle-title {
      font-size: 1.5rem;
      font-weight: 700;
      white-space: nowrap; /* منع نزول الكلمة للسطر الثاني */
      text-align: center;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
    }

    .bundle-description {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.75);
      text-align: center;
      line-height: 1.6;
    }

    /* زجاجي للزر الداخلي */
    .glass-btn {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      background: rgba(168, 85, 247, 0.2);
      backdrop-filter: blur(8px);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    .glass-btn:hover {
      background: rgba(168, 85, 247, 0.4);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="main-container">
    
    <!-- كارت Web Page Bundles الزجاجي والمضيء -->
    <div class="glass-card-wrapper">
      <div class="glass-card">
        <h2 class="bundle-title">باقت تصميم الويب - Web Page Bundles</h2>
        <p class="bundle-description">
          أطلق مساحتك الرقمية اليوم، تصاميم فائقة السرعة وجيل جديد مخصص للمبدعين.
        </p>
        <button class="glass-btn">استكشف الباقات</button>
      </div>
    </div>

  </div>

</body>
</html>
