<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none" />
  <title>3D Physical Touch Cards Carousel</title>

  <!-- Tailwind CSS CDN v4 -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      touch-action: none; 
      user-select: none;
      -webkit-user-select: none;
    }

    .perspective-container {
      perspective: 1350px;
    }

    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen flex items-center justify-center overflow-hidden selection:bg-transparent">

  <!-- Container for Pointer Events -->
  <div id="interaction-proxy" class="absolute inset-0 z-50 cursor-grab active:cursor-grabbing"></div>

  <!-- 3D perspective camera space -->
  <div class="perspective-container relative w-full h-full flex items-center justify-center pointer-events-none z-10">
    
    <!-- Dynamic 3D coordinate viewport -->
    <div id="card-viewport" class="absolute preserve-3d" style="width: 336px; height: 211px; transform: rotateZ(-3deg);">
      <!-- Cards will be injected dynamically via JS -->
    </div>

  </div>

  <script>
    // Data Setup
    const CARD_VIDEOS = [
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260506_030111_a9e15665-d379-4a7f-8116-695bbe452ad1.mp4',
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260429_171347_f640c30d-ec21-426a-98bc-77e07c2c60cb.mp4',
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260503_104800_bc43ae09-f494-43e3-97d7-2f8c1692cfd7.mp4',
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260423_161253_c72b1869-400f-45ed-ac0c-52f68c2ed5bd.mp4',
      'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_115655_b4d9cd77-feed-43cd-a198-af78ebdf1f7a.mp4'
    ];

    const CARD_DETAILS = [
      { number: '4232 8908 1121 4892', name: 'ZACHARY MERCER', cvv: '382' },
      { number: '4154 7831 9904 5124', name: 'SOPHIA MARTINEZ', cvv: '109' },
      { number: '5457 4120 7733 9035', name: 'BENJAMIN CARTER', cvv: '764' },
      { number: '4441 5567 1223 2468', name: 'EMILY MORRISON', cvv: '491' },
      { number: '5375 8891 2234 7713', name: 'JACKSON REID', cvv: '255' }
    ];

    const cardCount = 5;
    const thicknessLayers = [-1.47, -0.73, 0, 0.73, 1.47];
    
    // Physical & Interaction State
    let progress = 0; 
    let visualProgress = 0; // متغير التنعيم الانسيابي (Liquid Smooth Value)
    
    // Physics constants
    const friction = 0.985; // احتكاك ناعم
    const autoPlaySpeed = 0.001; 
    const dragSensitivity = 0.003; 

    // Interaction variables
    let isDragging = false;
    let isThrowing = false;
    let startY = 0;
    let startProgress = 0;
    let currentVelocity = 0;
    let lastTime = 0;
    let lastY = 0;
    
    // Mouse tilt interaction
    const mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };
    let metrics = { cardW: 336, cardH: 211 };
    
    const viewport = document.getElementById('card-viewport');
    const proxy = document.getElementById('interaction-proxy');
    const cardElements = [];

    // 1. Build Cards HTML Structure
    function buildCards() {
      viewport.innerHTML = '';
      for (let i = 0; i < cardCount; i++) {
        const cardContainer = document.createElement('div');
        cardContainer.className = 'absolute inset-0 preserve-3d pointer-events-none';
        cardContainer.style.width = `${metrics.cardW}px`;
        cardContainer.style.height = `${metrics.cardH}px`;
        cardContainer.style.backfaceVisibility = 'hidden';

        const videoSrc = CARD_VIDEOS[i % CARD_VIDEOS.length];
        const details = CARD_DETAILS[i % CARD_DETAILS.length];

        thicknessLayers.forEach((zOffset, layerIdx) => {
          const isFrontFace = layerIdx === thicknessLayers.length - 1;
          const isBackFace = layerIdx === 0;

          const layer = document.createElement('div');
          layer.className = 'absolute inset-0 rounded-[16px] overflow-hidden';
          
          if (!isFrontFace && !isBackFace) {
            layer.style.backgroundColor = '#808080';
            layer.style.transform = `translateZ(${zOffset}px)`;
            layer.classList.add('border', 'border-[#808080]');
          } else if (isFrontFace) {
            layer.classList.add('border', 'border-white/15', 'backface-hidden');
            layer.style.backgroundColor = '#0f0f0f';
            layer.style.transform = `translateZ(${zOffset}px)`;
            layer.style.boxShadow = 'inset 0 1px 1px rgba(255,255,255,0.15)';

            layer.innerHTML = `
              <video src="${videoSrc}" autoPlay loop muted playsInline class="absolute inset-0 w-full h-full object-cover rounded-[16px]"></video>
              <div class="absolute inset-0 p-5 sm:p-6 text-white h-full w-full font-sans z-10 bg-black/15">
                
                <div class="absolute left-5 sm:left-6 top-1/2 -translate-y-1/2">
                  <svg class="w-6 h-6 sm:w-[29px] sm:h-[29px]" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M20 8H40V14C40.0016 14.5299 40.2128 15.0377 40.5875 15.4125C40.9623 15.7872 41.4701 15.9984 42 16H59V24H42C41.4701 24.0016 40.9623 24.2128 40.5875 24.5875C40.2128 24.9623 40.0016 25.4701 40 26V52H20V8ZM18 8H8.00039C4.47435 8 1.56576 10.6083 1.08 14H18V8ZM1 16V24V26V34V36V44H18V36H1V34H18V26H1V24H18V16H1ZM1.08 46C1.56576 49.3917 4.47435 52 8.00039 52H18V46H1.08ZM42 14V8H52.0004C55.5264 8 58.4342 10.6084 58.92 14H42ZM59 26H42V34H59V26ZM59 36H42V44H59V36ZM52.0004 52H42V46H58.92C58.4342 49.3916 55.5264 52 52.0004 52Z" fill="url(#chip_grad_${i})" />
                    <defs>
                      <linearGradient id="chip_grad_${i}" x1="30" y1="8" x2="30" y2="52" gradientUnits="userSpaceOnUse">
                        <stop stop-color="white" />
                        <stop offset="1" stop-color="#999999" />
                      </linearGradient>
                    </defs>
                  </svg>
                </div>

                <div class="absolute right-5 sm:right-6 top-5 sm:top-6 opacity-95">
                  <svg class="w-[84px] xs:w-[101px] sm:w-[120px] h-auto" viewBox="0 0 341 49" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8.75294 47.68C6.10761 47.68 4.10227 47.04 2.73694 45.76C1.41427 44.48 0.582275 42.7733 0.240941 40.64C-0.100392 38.464 -0.0790588 36.0747 0.304941 33.472C0.731608 30.8267 1.37161 28.1813 2.22494 25.536C3.07827 22.848 3.99561 20.3307 4.97694 17.984C6.00094 15.5947 6.93961 13.5893 7.79294 11.968C8.26227 11.072 8.88094 10.56 9.64894 10.432C10.4169 10.2613 11.1423 10.368 11.8249 10.752C12.5503 11.136 13.0623 11.6907 13.3609 12.416C13.7023 13.1413 13.6383 13.9307 13.1689 14.784C11.2916 18.368 9.79828 21.7813 8.68894 25.024C7.57961 28.2667 6.85427 31.1467 6.51294 33.664C6.21427 36.1387 6.23561 38.1013 6.57694 39.552C6.96094 40.96 7.68628 41.664 8.75294 41.664C9.73428 41.664 10.8009 41.3013 11.9529 40.576C13.1049 39.8507 14.3423 38.5493 15.6649 36.672C17.0303 34.6667 18.3529 32.064 19.6329 28.864C20.9556 25.6213 22.1289 21.8667 23.1529 17.6C23.4089 16.6187 23.8783 15.9573 24.5609 15.616C25.2863 15.2747 26.0329 15.2107 26.8009 15.424C27.5689 15.6373 28.1876 16.064 28.6569 16.704C29.1263 17.3013 29.2543 18.0693 29.0409 19.008C27.9316 23.616 27.3769 27.5627 27.3769 30.848C27.4196 34.1333 27.7609 36.5227 28.4009 38.016C28.8703 39.0827 29.4249 39.8507 30.0649 40.32C30.7476 40.7893 31.4943 41.024 32.3049 41.024C33.1156 41.024 33.9689 40.7253 34.8649 40.128C35.8036 39.488 36.7209 38.4 37.6169 36.864C38.5556 35.328 39.3876 33.216 40.1129 30.528C37.6809 28.48 35.6756 25.7707 34.0969 22.4C32.5183 19.0293 31.7289 15.168 31.7289 10.816C31.7289 8.93867 31.9423 7.21067 32.3689 5.632C32.7956 4.05333 33.5209 2.79467 34.5449 1.856C35.5689 0.874666 36.9769 0.383999 38.7689 0.383999C40.9449 0.383999 42.7156 1.17333 44.0809 2.752C45.4463 4.288 46.4489 6.37867 47.0889 9.024C47.7289 11.6267 48.0063 14.5493 47.9209 17.792C47.8783 21.0347 47.5369 24.3413 46.8969 27.712C47.5369 28.0107 48.2196 28.2453 48.9449 28.416C49.7129 28.5867 50.4809 28.672 51.2489 28.672C52.9983 28.672 54.7903 28.416 56.6249 27.904C58.5023 27.3493 60.1023 26.6453 61.4249 25.792C62.2783 25.2373 63.0676 25.088 63.7929 25.344C64.5183 25.5573 65.0943 26.0053 65.521 26.688C65.9476 27.328 66.1183 28.0533 66.0329 28.864C65.9903 29.632 65.5636 30.272 64.7529 30.784C62.8756 32.0213 60.7423 33.0027 58.3529 33.728C56.0063 34.4533 53.6383 34.816 51.2489 34.816C49.2863 34.816 47.3449 34.4533 45.4249 33.728C44.1876 37.7387 42.5023 40.96 40.3689 43.392C38.2356 45.824 35.5476 47.04 32.3049 47.04C30.2569 47.04 28.3583 46.4427 26.6089 45.248C24.9023 44.0107 23.6223 42.4107 22.7689 40.448C22.5983 40.064 22.4276 39.6587 22.2569 39.232C22.1289 38.8053 22.0223 38.4 21.9369 38.016C21.7236 38.4 21.4889 38.7627 21.2329 39.104C21.0196 39.4453 20.7849 39.7867 20.5289 40.128C18.9503 42.3467 17.1796 44.16 15.2169 45.568C13.2969 46.976 11.1423 47.68 8.75294 47.68ZM41.5849 23.104C42.0116 19.9893 42.1183 17.3653 41.9049 15.232C41.6916 13.0987 41.3503 11.392 40.8809 10.112C40.4116 8.78933 39.9423 7.85067 39.4729 7.296C39.0463 6.69867 38.8116 6.4 38.7689 6.4C38.7689 6.4 38.6836 6.42133 38.5129 6.464C38.3849 6.464 38.2356 6.76267 38.0649 7.36C37.9369 7.91467 37.8729 9.06667 37.8729 10.816C37.8729 12.992 38.1929 15.168 38.8329 17.344C39.4729 19.4773 40.3903 21.3973 41.5849 23.104Z" fill="white"/>
                  </svg>
                </div>

                <div class="absolute right-5 sm:right-6 bottom-5 sm:bottom-6 flex -space-x-3 items-center opacity-90">
                  <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-white/20 backdrop-blur-[1px] border border-white/10"></div>
                  <div class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-white/35 backdrop-blur-[1px] border border-white/10"></div>
                </div>

              </div>
            `;
          } else if (isBackFace) {
            layer.classList.add('border', 'border-white/15', 'backface-hidden');
            layer.style.backgroundColor = '#0f0f0f';
            layer.style.transform = `translateZ(${zOffset}px) rotateX(180deg)`;
            layer.style.boxShadow = 'inset 0 1px 1px rgba(255,255,255,0.15)';

            layer.innerHTML = `
              <div class="absolute inset-0 pointer-events-none" style="filter: blur(16px); transform: scale(1.15);">
                <video src="${videoSrc}" autoPlay loop muted playsInline class="absolute inset-0 w-full h-full object-cover"></video>
              </div>
              <div class="absolute left-0 right-0 top-4 sm:top-5 h-7 sm:h-9 bg-black/85 backdrop-blur-md z-10"></div>
              <div class="absolute left-4 sm:left-6 bottom-4 sm:bottom-5 z-20 flex flex-col gap-0.5 sm:gap-1 text-left font-mono">
                <div class="text-[10px] sm:text-[12px] font-medium tracking-[0.14em] text-white select-none">${details.number}</div>
                <div class="text-[7px] sm:text-[9px] font-medium text-white/70 tracking-wide flex items-center gap-2 select-none">
                  <span class="uppercase">${details.name}</span>
                  <span class="text-white/40 font-light">•</span>
                  <span>CVV: ${details.cvv}</span>
                </div>
              </div>
            `;
          }

          cardContainer.appendChild(layer);
        });

        viewport.appendChild(cardContainer);
        cardElements.push(cardContainer);
      }
    }

    // 2. Physical & Responsive Resizing
    function handleResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      let cardW = Math.round(w * 0.16 + 130);
      const heightFactor = Math.min(1.0, Math.max(0.65, h / 850));
      cardW = Math.round(cardW * heightFactor);
      cardW = Math.min(336, Math.max(150, cardW));
      const cardH = Math.round(cardW / 1.5925);

      metrics = { cardW, cardH };

      viewport.style.width = `${cardW}px`;
      viewport.style.height = `${cardH}px`;

      cardElements.forEach(el => {
        el.style.width = `${cardW}px`;
        el.style.height = `${cardH}px`;
      });
    }

    // 3. Touch & Drag Handlers
    proxy.addEventListener('pointerdown', (e) => {
      isDragging = true;
      isThrowing = false; 
      currentVelocity = 0; 
      
      startY = e.clientY;
      lastY = e.clientY;
      lastTime = performance.now();
      startProgress = progress;

      if(e.cancelable) e.preventDefault();
    });

    window.addEventListener('pointermove', (e) => {
      const rx = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
      const ry = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);
      mouse.targetX = Math.max(-1, Math.min(1, rx));
      mouse.targetY = Math.max(-1, Math.min(1, ry));

      if (!isDragging) return;

      const currentTime = performance.now();
      const dy = e.clientY - startY; 
      const dt = currentTime - lastTime; 
      const instantDy = e.clientY - lastY; 

      progress = startProgress - (dy * dragSensitivity);

      if (dt > 0) {
        const instantVelocity = (instantDy * dragSensitivity) / (dt / 1000);
        currentVelocity = currentVelocity * 0.6 + instantVelocity * 0.4;
      }

      lastY = e.clientY;
      lastTime = currentTime;
    });

    window.addEventListener('pointerup', () => {
      if (!isDragging) return;
      isDragging = false;

      if (Math.abs(currentVelocity) > 0.05) {
        isThrowing = true;
        currentVelocity *= 1.2;
      }
    });

    window.addEventListener('pointercancel', () => {
      isDragging = false;
      isThrowing = false;
    });

    window.addEventListener('resize', handleResize);

    // 4. Liquid Smooth Animation & Render Loop
    function renderLoop() {
      if (isDragging) {
        // يتم التحديث عبر PointerMove
      } else if (isThrowing) {
        progress -= currentVelocity * 0.016; 
        currentVelocity *= friction;

        if (Math.abs(currentVelocity) < 0.001) {
          isThrowing = false;
          currentVelocity = 0;
        }
      } else {
        progress += autoPlaySpeed;
      }

      // معادلة التنعيم السائل (Liquid Smoothing Layer):
      // تجعل حركة العرض تتبع الهدف بسلاسة فائقة وبدون أي نترات
      visualProgress += (progress - visualProgress) * 0.15;

      mouse.x += (mouse.targetX - mouse.x) * 0.08;
      mouse.y += (mouse.targetY - mouse.y) * 0.08;

      const h = window.innerHeight;
      const { cardH } = metrics;

      // نستخدم التنعيم السائل مباشرة لنلغي المطبات نهائياً
      const virtualActiveIndex = visualProgress;

      for (let i = 0; i < cardCount; i++) {
        const card = cardElements[i];
        if (!card) continue;

        let offset = i - virtualActiveIndex;
        const halfCount = cardCount / 2;
        while (offset > halfCount) offset -= cardCount;
        while (offset < -halfCount) offset += cardCount;

        const absOffset = Math.abs(offset);
        const sign = Math.sign(offset);

        if (absOffset > 3.0) {
          card.style.visibility = 'hidden';
          continue;
        } else {
          card.style.visibility = 'visible';
        }

        const gap = 36;
        const peekAmount = -55;
        const D = 1350;

        let y = 0, z = 0, rot = 0;

        if (absOffset <= 1) {
          const t = absOffset;
          const easedT = t * t * (3 - 2 * t);
          const targetY = cardH + gap;

          y = -sign * (easedT * targetY);
          z = 400 + easedT * (220 - 400);
          rot = easedT * 132;
        } else if (absOffset <= 2) {
          const t = absOffset - 1;
          const easedT = t * t * (3 - 2 * t);

          const yStart = cardH + gap;
          const zStart = 220;

          const zEnd = -60;

          const sEnd = D / (D - zEnd);
          const yEnd = (h / 2 - peekAmount) / sEnd - (cardH / 2);

          const currentY = yStart + easedT * (yEnd - yStart);
          y = -sign * currentY;
          z = zStart + easedT * (zEnd - zStart);
          rot = 132 + easedT * (175 - 132);
        } else {
          const t = Math.min(absOffset - 2, 1);
          const easedT = t * t * (3 - 2 * t);

          const zStart = -60;
          const zEnd3 = -250;

          const sEnd2 = D / (D - zStart);
          const yEnd2 = (h / 2 - peekAmount) / sEnd2 - (cardH / 2);

          const sEnd3 = D / (D - zEnd3);
          const yEnd3 = (h / 2 + 100) / sEnd3 + (cardH / 2);

          const currentY = yEnd2 + easedT * (yEnd3 - yEnd2);
          y = -sign * currentY;
          z = zStart + easedT * (zEnd3 - zStart);
          rot = 175 + easedT * (195 - 175);
        }

        const localCardRotation = -sign * rot;
        const centerFactor = Math.max(0, 1 - absOffset);

        const maxTiltY = 15;
        const maxTiltX = 12;

        const activeTiltX = -mouse.y * maxTiltX * centerFactor;
        const activeTiltY = mouse.x * maxTiltY * centerFactor;

        const totalRotX = localCardRotation + activeTiltX;
        const totalRotY = activeTiltY;

        card.style.zIndex = Math.round(z).toString();
        card.style.opacity = '1';
        card.style.transform = `translateY(${y.toFixed(2)}px) translateZ(${z.toFixed(2)}px) rotateX(${totalRotX.toFixed(2)}deg) rotateY(${totalRotY.toFixed(2)}deg)`;
      }

      requestAnimationFrame(renderLoop);
    }

    // Initialize
    buildCards();
    handleResize();
    requestAnimationFrame(renderLoop);
  </script>
</body>
</html>
